# Render Blueprint: één Node web service, automatisch gedeployed bij elke push naar main.
services:
  - type: web
    name: iex-portfolio
    runtime: node
    plan: starter   # altijd wakker ($7 per maand); gekozen door Rogier op 2026-11-16
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EODHD_API_KEY   # Render vraagt hierom bij het aanmaken; zonder key draait de app op voorbeelddata
        sync: false
      - key: FMP_API_KEY     # optioneel: aanvullende kerncijfers en koersdoelen (Financial Modeling Prep)
        sync: false
